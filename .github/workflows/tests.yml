name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # The reproduction target's data is not available to CI; data-backed tests skip by
      # design. The scaffold-contract tests below run here and are the point of this job.
      - run: pytest -q
